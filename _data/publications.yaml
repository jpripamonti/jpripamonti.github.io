datasets:

  - title: "Argentine Senate stenographic transcripts, 2000-2024: a speaker-attributed corpus"
    authors: "Juan Pablo Ripamonti"
    year: "2026"
    repository: "Zenodo"
    doi: "https://doi.org/10.5281/zenodo.22661019"
    status: "Zenodo record, version 0.4.37. The DOI above resolves to the latest version; the DOI for this version is 10.5281/zenodo.22661020."
    coverage: "559 sittings of the Argentine Senate, February 2000 to December 2024. Complete from 2004 onward; thinner before that, because the chamber's portal lists the earlier sittings but no longer serves the files."
    citation: "Cite the concept DOI for the corpus, or the version DOI when the exact files matter."
    limitations: "Two sittings of November 2001 are character recognition of scans and should be excluded from text analysis, and one sitting does not parse at all. 1,109 passages carry no speaker. The caucus is observed on 336 days across 25 years rather than continuously, and every row says which day it was read from."
    description: "Every stenographic record the Argentine Senate still serves for its sittings between 2000 and 2024, parsed from the chamber's own PDFs into 233,408 passages: 151,761 of speech, 18.4 million words, and 31,955 typed stenographer's notes. Each passage carries the speaker label the page printed, the senator that label resolves to, and the caucus that senator sat with on the day of the sitting — which is not the list they were elected on, and differs from it for nearly a fifth of floor speech. The deposit holds the corpus, the pipeline that produces it and the 36 hand-annotated pages the parser is scored against (F1 = 0.996 on 125 turns). The source PDFs are not redistributed: a manifest identifies each by checksum and URL, and the shipped downloader fetches them again."

  - title: "Electoral Results by Polling Table in the Ciudad Autónoma de Buenos Aires, 2011-2025"
    authors: "Juan Pablo Ripamonti"
    year: "2026"
    doi: "https://doi.org/10.7910/DVN/PVKZCM"
    coverage: "CABA election results at polling-table level for national elections from 2011 through 2025 and CABA city elections from 2013 through 2025."
    description: "This dataset contains official electoral results for the Ciudad Autónoma de Buenos Aires (CABA), Argentina, normalized at the polling-table level. It includes national elections from 2011 through 2025 and CABA city elections from 2013 through 2025, covering offices such as Head of Government, City Legislature, and Communal Boards. The data were curated from official BA Data/GCBA, Tribunal Superior de Justicia historical references, DINE, and Datos Argentina sources, providing table-level result rows with a comprehensive manifest and coverage reports."

  - title: "Geocoded Polling Places in the Ciudad Autónoma de Buenos Aires, 2011-2025"
    authors: "Juan Pablo Ripamonti"
    year: "2026"
    doi: "https://doi.org/10.7910/DVN/RBAYGP"
    coverage: "CABA voting-location assignments by year, voting location, and table range for elections from 2011 through 2025."
    description: "This dataset contains geocoded voting locations for the Ciudad Autónoma de Buenos Aires (CABA), Argentina, covering elections from 2011 through 2025. The unit of observation is a voting-location assignment by year and table range: year x voting location x voting table range. The public files preserve original establishment, address, and locality fields alongside curated canonical establishment names, canonical addresses, opaque entity identifiers, and WGS84 coordinates."

papers:

  - title: "Does being informed about government transparency boost trust? Exploring an overlooked mechanism"
    authors: "Juan Pablo Ripamonti"
    venue: "Government Information Quarterly"
    paper_pdf: "https://www.sciencedirect.com/science/article/pii/S0740624X24000522"
    appendix: "/assets/GIQ_appendix.pdf"
    abstract: |
      Governments implement transparency policies aiming to enhance citizens' trust, but the outcomes of these efforts are complex and not fully understood. Existing literature often focuses on how citizens consume government information, but tends to overlook the impact of the act of disclosure itself. This study seeks to fill this gap by examining citizens' responses to the act of government disclosure, independent of the content disclosed. Through a factorial survey experiment, the research manipulates motivations, types, and levels of information disclosure across two distinct organizations to assess their impact on public trust. The findings reveal that the act of disclosure generally enhances trust perceptions, but this effect is significantly modulated by individuals' pre-existing attitudes toward transparency. Those indifferent about transparency do not show increased trust, while for those who value transparency, trust increases notably. The study also finds that the disclosure of performance information, particularly when combined with financial information, has the most substantial impact on trust. Moreover, public trust is higher when organizations disclose more information than legally required. These results contribute to a more nuanced understanding of how government transparency influences public trust and highlight the importance of considering citizen attitudes in transparency initiatives.
    year: "2024"
    category: peer_reviewed

  - title: "How Transparency Influences Trust in Government: A Multi-Mechanism Framework."
    authors: "Juan Pablo Ripamonti, Greg Porumbescu, Greta Nasi"
    venue: "Revise and resubmit at Perspectives on Public Management and Governance"
    abstract: "While the relationship between transparency and trust in government is increasingly recognized as complex, existing theories offer fragmented accounts that focus on different aspects of the relationship. As a result, we lack clear explanations for divergent empirical findings and for when transparency affects trust. We address this gap by developing an integrative framework grounded in citizens’ attribution processes. We argue that transparency shapes trust in public organizations by providing cues that citizens use to infer whether an organization has the capacity and orientation to meet expectations. Such cues may arise from disclosure itself, from citizens’ engagement with disclosed information directly or via intermediaries, and from organizational behavioral and performance changes induced by transparency arrangements. We label these pathways disclosure-, information-, and behavior-based mechanisms, and specify key conditions and contextual moderators under which they influence trust. We illustrate the framework using hypothetical scenarios involving police body-worn cameras and hospital performance reporting, and discuss implications for research and the design of transparency initiatives."
    category: revise_and_resubmit

  - title: "Strategies for mediating downstream citizen voice into public policy and service ecosystems - what, how and why?"
    authors: "Rebecca Kirley, Juan Pablo Ripamonti, Maria Cucciniello"
    venue: "Revise and resubmit at Governance"
    abstract: "Citizen voice is solicited in government to hold providers accountable, advance democratic values, and improve service delivery. Downstream citizen voice, such as complaints, can reveal pressure points, diverse needs, and failures in complex service ecosystems. However, theory and evidence on how noisy, unstructured citizen voice is mediated into policy and service arenas remain limited. Addressing this gap, this project looks to ombud institutions and related actors, which span citizen–state boundaries and policy networks. We use a qualitative approach to elaborate the concept of citizen voice mediation and to explore what strategies ombuds use to mediate downstream voice, and what drives these choices. Findings from interpretivist analysis of documents and interviews in Italy, the UK, and Argentina identify three outward mediation repertoires—authoritative‑targeted, facilitative‑collectivizing, and making information accessible and meaningful—expressed through directive (AR), hybrid (IT), and curatorial (UK) profiles. These strategies are shaped by different forms of ecosystemic fragmentation and actor capacities. The study advances a novel theorization of citizen voice mediation, develops positive propositions for testing, and deepens understanding of how voice can be strategically mediated to foster change in complex policy and service ecosystems."
    category: revise_and_resubmit

  - title: "Freedom of Transparency reforms bite small-town mayors harder: incumbency advantage narrows after FOI adoption only in smaller U.S. cities"
    authors: "Juan Pablo Ripamonti, Greta Nasi, Rebecca Kirley, Maria Cucciniello"
    venue: "Proceedings of the 60th Hawaii International Conference on System Sciences (HICSS-60)"
    year: "2027"
    forthcoming: true
    category: conference


  - title: "3D Printing: A New Industrial Revolution?"
    authors: "Juan Pablo Ripamonti"
    venue: "In: Kléber Ghimire (ed.), Future Courses of Human Societies: Critical Reflections from the Natural and Social Sciences. Routledge"
    abstract: "This chapter examines the transformative potential of additive manufacturing (AM), or 3D printing, as a catalyst for a new industrial revolution. It contrasts AM with the traditional factory system, discussing how AM could decentralize production and enable mass customization. By presenting two scenarios, the chapter explores the economic and social impacts of widespread AM adoption, including shifts in labor markets, challenges to global supply chains, and issues surrounding intellectual property in a digital world. The discussion concludes by considering the broader implications of AM, highlighting its potential to democratize production and reduce waste while raising critical questions about economic stability and the future of work."
    year: "2018"
    category: book_chapter

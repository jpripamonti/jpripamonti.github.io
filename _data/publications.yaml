  - title: "Argentine Senate stenographic transcripts, 2000-2024: a speaker-attributed corpus"
    authors: "Juan Pablo Ripamonti"
    year: "2026"
    repository: "Zenodo"
    doi: "https://doi.org/10.5281/zenodo.22661019"
    summary: "Every stenographic record the Argentine Senate still serves for its sittings between 2000 and 2024, parsed out of the chamber's own PDFs, with each passage attributed to the senator who spoke it and to the caucus that senator sat with that day."
    stats:
      - value: "559"
        label: "sittings"
      - value: "233,408"
        label: "passages"
      - value: "18.4M"
        label: "words of speech"
      - value: "0.996"
        label: "parser F1"
    description: "The deposit holds the corpus, the pipeline that produces it, and the 36 hand-annotated pages the parser is scored against. Of the 233,408 passages, 151,761 are speech and 31,955 are typed stenographer's notes, and the rest are section headings, page furniture, and stray italics, kept so that any passage can be traced back to the page it came from. Each passage carries the speaker label the page printed, the senator that label resolves to, and the caucus that senator sat with on the day of the sitting, which is not the list they were elected on and differs from it for nearly a fifth of floor speech. The source PDFs are not redistributed. A manifest identifies each one by checksum and URL, and the shipped downloader fetches them again."
    coverage: "559 sittings, February 2000 to December 2024. Complete from 2004 onward and thinner before that, because the chamber's portal lists the earlier sittings but no longer serves the files."
    limitations: "Two sittings of November 2001 are character recognition of scans and should be excluded from text analysis, and one sitting does not parse at all. 1,109 passages carry no speaker. The caucus is observed on 336 days across 25 years rather than continuously, and every row says which day it was read from."
    citation: "Cite the concept DOI for the corpus, or the version DOI when the exact files matter. This is version 0.4.37, whose own DOI is 10.5281/zenodo.22661020."

  - title: "Electoral Results by Polling Table in the Ciudad Autónoma de Buenos Aires, 2011-2025"
    authors: "Juan Pablo Ripamonti"
    year: "2026"
    repository: "Harvard Dataverse"
    doi: "https://doi.org/10.7910/DVN/PVKZCM"
    summary: "Official results for the elections held in the city of Buenos Aires between 2011 and 2025, normalized so that every row is one office's count at one polling table."
    stats:
      - value: "2011-2025"
        label: "elections covered"
      - value: "Polling table"
        label: "unit of observation"
      - value: "8.3M"
        label: "result rows"
    description: "Covers the national elections of 2011 through 2025 and the city elections of 2013 through 2025, for every office on those ballots, from president and national deputies to Head of Government, the City Legislature, and the Communal Boards. The results were curated from BA Data/GCBA, the historical references of the Tribunal Superior de Justicia, DINE, and Datos Argentina, and are shipped with a manifest and coverage reports that say which source each row came from."
    coverage: "National elections 2011 through 2025 and city elections 2013 through 2025, at polling-table level."

  - title: "Geocoded Polling Places in the Ciudad Autónoma de Buenos Aires, 2011-2025"
    authors: "Juan Pablo Ripamonti"
    year: "2026"
    repository: "Harvard Dataverse"
    doi: "https://doi.org/10.7910/DVN/RBAYGP"
    summary: "Each of the 1,918 places where people voted in Buenos Aires between 2011 and 2025, placed on the map and tied to the range of polling tables it held that year, so results can be mapped and not only tabulated."
    stats:
      - value: "2011-2025"
        label: "elections covered"
      - value: "1,918"
        label: "voting locations"
      - value: "7,314"
        label: "location-year assignments"
      - value: "WGS84"
        label: "coordinates"
    description: "The table ranges line up with the polling tables in the results dataset above, so the two join. The public files keep the original establishment, address, and locality fields as they were published, and add curated canonical establishment names, canonical addresses, opaque entity identifiers, and WGS84 coordinates."
    coverage: "Voting-location assignments by year, voting location, and table range, for elections from 2011 through 2025."

papers:

  - title: "Does being informed about government transparency boost trust? Exploring an overlooked mechanism"
    authors: "Juan Pablo Ripamonti"
    venue: "Government Information Quarterly"
    paper_pdf: "https://www.sciencedirect.com/science/article/pii/S0740624X24000522"
    abstract: |
      Governments implement transparency policies aiming to enhance citizens' trust, but the outcomes of these efforts are complex and not fully understood. Existing literature often focuses on how citizens consume government information, but tends to overlook the impact of the act of disclosure itself. This study seeks to fill this gap by examining citizens' responses to the act of government disclosure, independent of the content disclosed. Through a factorial survey experiment, the research manipulates motivations, types, and levels of information disclosure across two distinct organizations to assess their impact on public trust. The findings reveal that the act of disclosure generally enhances trust perceptions, but this effect is significantly modulated by individuals' pre-existing attitudes toward transparency. Those indifferent about transparency do not show increased trust, while for those who value transparency, trust increases notably. The study also finds that the disclosure of performance information, particularly when combined with financial information, has the most substantial impact on trust. Moreover, public trust is higher when organizations disclose more information than legally required. These results contribute to a more nuanced understanding of how government transparency influences public trust and highlight the importance of considering citizen attitudes in transparency initiatives.
    year: "2024"
    category: peer_reviewed

  - title: "How Transparency Influences Trust in Government: A Multi-Mechanism Framework"
    authors: "Juan Pablo Ripamonti, Greg Porumbescu, Greta Nasi"
    venue: "Perspectives on Public Management and Governance"
    abstract: "Scholars increasingly recognize that the relationship between transparency and trust in government is complex. Yet existing theories capture only fragments of it. As a result, it remains unclear why findings diverge and when transparency affects trust. We address this gap by developing an integrative account grounded in citizens' inferential processes. We distinguish transparency as a process (an organization's disclosure practices) from transparency as a product (the resulting availability of information to outsiders). We argue that transparency influences trust in public organizations through cues from which citizens infer an organization's capacity and orientation to fulfill its domain functions. These cues arise from the disclosure practice itself, from citizens' engagement with disclosed information (directly or through intermediaries), and from changes in organizational behavior and performance, grouped into disclosure-, information-, and behavior-based mechanisms. Drawing on attribution theory, complemented by agency and signaling theory, we specify the conditions and moderators under which each mechanism updates citizens' perceptions of organizational capacity, orientation, or both. Because transparency can strengthen, weaken, or leave these perceptions unchanged, the same mechanism can raise trust, leave it unchanged, or erode it. Trust and trustworthiness can also come apart. When disclosure changes the incentives citizens believe an organization's personnel face, transparency can raise trust without raising perceived trustworthiness. We systematize four boundary conditions and paradoxical effects under which transparency fails to build trust or undermines it, namely prior cynicism, information overload, metric gaming, and selective disclosure. We draw implications for research and for designing transparency initiatives attentive to citizens' interpretive processes and institutional environments."
    category: revise_and_resubmit

  - title: "Strategies for mediating downstream citizen voice into public policy and service ecosystems - what, how and why?"
    authors: "Rebecca Kirley, Juan Pablo Ripamonti, Maria Cucciniello"
    venue: "Governance"
    abstract: "Citizen voice is solicited in government to hold providers accountable, advance democratic values, and improve service delivery. Downstream citizen voice, such as complaints, can reveal pressure points, diverse needs, and failures in complex service ecosystems. However, theory and evidence on how noisy, unstructured citizen voice is mediated into policy and service arenas remain limited. Addressing this gap, this project looks to ombud institutions and related actors, which span citizen–state boundaries and policy networks. We use a qualitative approach to elaborate the concept of citizen voice mediation and to explore what strategies ombuds use to mediate downstream voice, and what drives these choices. Findings from interpretivist analysis of documents and interviews in Italy, the UK, and Argentina identify three outward mediation repertoires—authoritative‑targeted, facilitative‑collectivizing, and making information accessible and meaningful—expressed through directive (AR), hybrid (IT), and curatorial (UK) profiles. These strategies are shaped by different forms of ecosystemic fragmentation and actor capacities. The study advances a novel theorization of citizen voice mediation, develops positive propositions for testing, and deepens understanding of how voice can be strategically mediated to foster change in complex policy and service ecosystems."
    category: revise_and_resubmit

  - title: "Incumbency advantage narrows after FOI adoption, but only in smaller U.S. cities"
    authors: "Juan Pablo Ripamonti, Greta Nasi, Rebecca Kirley, Maria Cucciniello"
    venue: "Proceedings of the 60th Hawaii International Conference on System Sciences (HICSS-60)"
    abstract: |
      This study uses quasi-experimental methods to test whether state Freedom of Information (FOI) reform affects the incumbency advantage in U.S. mayoral elections, hypothesizing larger effects in smaller cities, where pre-existing scrutiny is weaker and administrative-political networks are more visible. Using mayoral-election data and coded state FOI effective dates, we estimate a close-election difference-in-discontinuities design separately by city size. For cities below the median population (about 84,000 residents), we estimate that FOI adoption reduces the close-election incumbency advantage by 14.6 percentage points (p = 0.004 with standard errors clustered on state, the level at which treatment is assigned), with no detectable effect in large cities or in the fully pooled sample. Supporting designs point the same way without being uniformly significant. The analysis contributes quasi-experimental evidence that the electoral effect of FOI adoption depends on city size, and reports a local-press test that narrows the candidate mechanisms without settling them.
    year: "2027"
    forthcoming: true
    category: conference


  - title: "3D Printing: A New Industrial Revolution?"
    authors: "Juan Pablo Ripamonti"
    venue: "In: Kléber Ghimire (ed.), Future Courses of Human Societies: Critical Reflections from the Natural and Social Sciences. Routledge"
    abstract: "This chapter examines the transformative potential of additive manufacturing (AM), or 3D printing, as a catalyst for a new industrial revolution. It contrasts AM with the traditional factory system, discussing how AM could decentralize production and enable mass customization. By presenting two scenarios, the chapter explores the economic and social impacts of widespread AM adoption, including shifts in labor markets, challenges to global supply chains, and issues surrounding intellectual property in a digital world. The discussion concludes by considering the broader implications of AM, highlighting its potential to democratize production and reduce waste while raising critical questions about economic stability and the future of work."
    year: "2018"
    category: book_chapter

name: Links

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Check links
        run: python3 .github/scripts/check_links.py _site

      - name: Healthchecks
        # Tells Healthchecks.io how the run ended (the dashboard of every scheduled task).
        if: always()
        env:
          URL: ${{ secrets.HEALTHCHECKS_URL_LINKS }}
          STATUS: ${{ job.status }}
        run: |
          [ -n "$URL" ] || exit 0
          [ "$STATUS" = success ] || URL="$URL/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "$URL" || true
